<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="粉紫色调的全屏随机 2D 迷宫小游戏。划线划出通往皇冠的路，或把公主拖向终点。">
<title>小公主迷宫 · 公主的皇冠</title>
<meta name="theme-color" content="#ffeef5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="公主迷宫">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/overlay.css">
</head>
<body>

<div id="stage">
  <canvas id="maze-canvas"></canvas>
  <canvas id="ink-canvas"></canvas>
</div>

<header id="controls">
  <div class="brand">🎀 小公主迷宫</div>
  <div class="seg" id="mode" role="radiogroup" aria-label="玩法模式">
    <button class="seg-btn" data-select="stroke" role="radio" aria-checked="false">✏️ 划线</button>
    <button class="seg-btn" data-select="hero" role="radio" aria-checked="false">👸 角色</button>
  </div>
  <div class="seg" id="size" role="radiogroup" aria-label="迷宫数量">
    <button class="seg-btn" data-select="fewest" role="radio" aria-checked="false">很少</button>
    <button class="seg-btn" data-select="few" role="radio" aria-checked="false">少</button>
    <button class="seg-btn is-active" data-select="medium" role="radio" aria-checked="true">一般</button>
    <button class="seg-btn" data-select="many" role="radio" aria-checked="false">多</button>
    <button class="seg-btn" data-select="most" role="radio" aria-checked="false">很多</button>
  </div>
  <div class="seg" id="level" role="radiogroup" aria-label="难度">
    <button class="seg-btn" data-select="easy" role="radio" aria-checked="false">简单</button>
    <button class="seg-btn is-active" data-select="medium" role="radio" aria-checked="true">一般</button>
    <button class="seg-btn" data-select="hard" role="radio" aria-checked="false">困难</button>
  </div>
  <div class="actions">
    <button id="btn-undo" class="action-btn" type="button" disabled>↩️ 撤销</button>
    <button id="btn-redo" class="action-btn" type="button" disabled>↪️ 重做</button>
    <button id="btn-clear" class="action-btn" type="button">🧽 重画</button>
    <button id="btn-new" class="action-btn primary" type="button">🍭 新迷宫</button>
    <button id="btn-settings" class="action-btn" data-settings type="button" aria-label="设置">⚙️</button>
  </div>
  <div id="hud">
    <span id="hud-time">⏱ 00:00</span>
    <span id="hud-msg">从 🏰 画一条线到 👑</span>
  </div>
</header>

<div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="card">
    <h1 id="settings-title">⚙️ 设置</h1>
    <p class="hint" id="settings-hint">选一个你喜欢的主题吧～</p>
    <div id="theme-list" class="theme-grid" role="radiogroup" aria-label="主题"></div>
    <label class="row trail-toggle">
      <span>角色模式显示移动轨迹</span>
      <input id="trail-enabled" type="checkbox" checked>
    </label>
    <div class="row">
      <button class="action-btn primary" data-close type="button">👌 完成</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
  <div class="card">
    <div class="big">👑</div>
    <h1>皇冠找到啦！</h1>
    <p id="win-info"></p>
    <div class="row">
      <button id="btn-again" class="action-btn primary" type="button">🍭 再玩一次</button>
      <button id="btn-close" class="action-btn" type="button">👀 看看迷宫</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
