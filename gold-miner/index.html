<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, height=device-height">
<meta name="theme-color" content="#6BB6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>黄金矿工</title>
<style>
  * { margin: 0; padding: 0;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #6BB6FF;
    touch-action: manipulation;
    font-family: sans-serif;
    position: fixed;
    inset: 0;
  }
  #wrap {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
  }
  #game {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    display: block;
    background: #6BB6FF;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 14px;
    display: -webkit-box;
    display: flex;
    -webkit-box-pack: justify; justify-content: space-between;
    -webkit-box-align: center; align-items: center;
    font-size: 22px; font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
    pointer-events: none; z-index: 10;
  }
  #msg {
    position: absolute; inset: 0;
    display: none;
    -webkit-box-align: center; align-items: center;
    -webkit-box-pack: center; justify-content: center;
    -webkit-box-orient: vertical; flex-direction: column;
    background: rgba(0,0,0,0.75);
    color: #fff;
    z-index: 20; padding: 20px; text-align: center;
  }
  #msg h1 { font-size: 40px; margin-bottom: 16px; }
  #msg p  { font-size: 24px; margin: 8px 0; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 16px;
    text-align: center; color: #fff; font-size: 18px;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game">您的浏览器不支持 Canvas</canvas>
  <div id="hud">
    <span id="score">分数 0</span>
    <span id="time">时间 60</span>
  </div>
  <div id="hint">点击屏幕:发射 / 取消 / 再发射</div>
  <div id="msg">
    <h1>游戏结束</h1>
    <p id="msgScore">得分 0</p>
    <p>点击屏幕重新开始</p>
  </div>
</div>

<script>
(function(){
  // ===== PWA: Service Worker 注册 (离线支持) =====
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
  // ===== Canvas & 全屏自适应 (Kindle 兼容) =====
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, scale = 1;

  function getViewport(){
    var w = 600, h = 800;
    try {
      if(window.visualViewport && window.visualViewport.height){
        w = window.visualViewport.width  || w;
        h = window.visualViewport.height || h;
      }
      w = window.innerWidth  || w;
      h = window.innerHeight || h;
      if(document.documentElement && document.documentElement.clientHeight){
        var cw = document.documentElement.clientWidth;
        var ch = document.documentElement.clientHeight;
        if(cw > 0 && cw > w) w = cw;
        if(ch > 0 && ch > h) h = ch;
      }
    } catch(e){}
    if(w < 100) w = 600;
    if(h < 100) h = 800;
    return { w:w, h:h };
  }

  function resize(){
    var v = getViewport();
    W = v.w; H = v.h;
    canvas.width  = W;
    canvas.height = H;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    layout();
  }

  function layout(){
    scale = Math.min(W, H) / 600;
    if(scale < 1) scale = 1;
    groundY = H * 0.30;
    miner = { x: W/2, y: H * 0.08 };
    if(items){
      var gy = groundY + 20, gh = H - gy - 20;
      for(var i=0;i<items.length;i++){
        var it = items[i];
        if(it.y < gy) it.y = gy + Math.random()*gh;
        it.x = distributeX(items.length, i, it.r);
      }
    }
  }

  // ===== 状态 =====
  var IDLE = 0, OUT = 1, BACK = 2;
  var state, score, timeLeft;
  var hookLen, hookAngle, swingDir, target, retractSpeed, outSpeed;
  var miner, items, groundY;

  function reset(){
    state = IDLE;
    score = 0;
    timeLeft = 60;
    hookLen = 0;
    hookAngle = Math.PI/2;
    swingDir = 1;
    target = null;
    retractSpeed = 0;
    outSpeed = 560 * scale;
    items = [];
    spawnItems();
    layout();
  }

  var _seed = 12345;
  function srand(){
    _seed = (_seed * 9301 + 49297) % 233280;
    return _seed / 233280;
  }
  function R(a,b){ return a + srand()*(b-a); }

  function distributeX(total, idx, r){
    var margin = r + 10;
    var usable = W - margin*2;
    if(usable <= 0) usable = W;
    var bucket = usable / total;
    var baseX = margin + bucket * idx + bucket * 0.5;
    var jitter = (srand() - 0.5) * bucket * 0.8;
    var x = baseX + jitter;
    if(x < margin) x = margin;
    if(x > W - margin) x = W - margin;
    return x;
  }

  function spawnItems(){
    var gy = groundY + 30;
    var gh = H - gy - 30;
    var idx = 0;
    // [type, val, r, count]
    var types = [
      // 金块 (卡通金黄,带描边)
      ['goldBig',   100, 30, 4, '#FFD700', '#B8860B'],
      ['goldMid',    50, 24, 6, '#FFC107', '#B8860B'],
      ['goldSmall',  20, 18, 8, '#FFB300', '#8B6914'],
      // 卡通动物
      ['chicken',    80, 28, 4, '#FFD54F', '#F9A825'],
      ['pig',        50, 24, 5, '#F8BBD0', '#EC407A'],
      ['rabbit',     30, 22, 5, '#FFFFFF', '#9E9E9E'],
      ['cat',        40, 24, 4, '#FFB74D', '#E65100'],
      ['turtle',     15, 26, 3, '#81C784', '#2E7D32'],
      // 钻石
      ['diamond',   250, 18, 4, '#00E5FF', '#0097A7']
    ];
    for(var t=0;t<types.length;t++){
      var type = types[t];
      for(var i=0;i<type[3];i++){
        items.push({
          x: 0, y: R(gy+10, gy+gh-type[2]),
          r: type[2]*scale, val: type[1],
          type: type[0], color: type[4], dark: type[5], taken:false
        });
        items[items.length-1].x = distributeX(43, idx++, items[items.length-1].r);
      }
    }
  }

  // ===== 输入 =====
  // IDLE  → 点击 → OUT   (基于当前摆动方向发射)
  // OUT   → 点击 → BACK  (取消发射,空钩收回)
  // BACK  → 点击 → OUT   (再发射,跳过收回)
  // 0 时间 → 点击 → reset (重玩)
  function onTap(e){
    if(e && e.preventDefault) e.preventDefault();
    if(e && e.stopPropagation) e.stopPropagation();

    if(timeLeft <= 0){ reset(); return; }
    if(state === IDLE){
      state = OUT;
      outSpeed = 560 * scale;
    } else if(state === OUT){
      if(target){ target.taken = false; target = null; }
      state = BACK;
      retractSpeed = 640 * scale;
    } else if(state === BACK){
      if(target){ target.taken = false; target = null; }
      hookLen = 0;
      hookAngle = Math.PI/2;
      state = OUT;
      outSpeed = 560 * scale;
    }
  }

  canvas.addEventListener('touchstart', onTap, false);
  canvas.addEventListener('click', onTap, false);
  document.addEventListener('keydown', function(e){
    var k = e.keyCode || e.which || 0;
    var key = e.key || '';
    if(key === ' ' || key === 'Enter' || key === 'ArrowDown' ||
       k === 13 || k === 32 || k === 40){
      if(e.preventDefault) e.preventDefault();
      onTap(e);
    }
  }, false);

  // ===== 更新 =====
  function update(dt){
    if(timeLeft > 0) timeLeft -= dt;
    if(timeLeft < 0) timeLeft = 0;

    // IDLE 自动摆动
    if(state === IDLE){
      hookAngle += swingDir * 2.5 * dt;
      if(hookAngle > Math.PI - 0.10) swingDir = -1;
      if(hookAngle < 0.10)           swingDir = 1;
    }

    // 伸出
    if(state === OUT){
      hookLen += outSpeed * dt;
      var tip = getTip();
      for(var i=0;i<items.length;i++){
        var it = items[i];
        if(it.taken) continue;
        var dx = tip.x - it.x, dy = tip.y - it.y;
        var rr = (it.r + 6*scale);
        if(dx*dx + dy*dy < rr*rr){
          target = it; it.taken = true;
          state = BACK;
          retractSpeed = (it.type === 'diamond') ? 220*scale :
                         (it.type === 'turtle') ? 110*scale :
                         (it.type === 'pig')    ? 180*scale :
                         (it.type === 'goldBig')? 200*scale :
                         (600 - it.r*10)*scale;
          break;
        }
      }
      if(state === OUT){
        if(hookLen >= H * 0.95 || tip.y >= H - 5){
          state = BACK;
          retractSpeed = 640 * scale;
        }
      }
    }

    // 收回
    if(state === BACK){
      hookLen -= retractSpeed * dt;
      if(hookLen < 0) hookLen = 0;
      if(target){
        target.x = miner.x + Math.cos(hookAngle) * hookLen;
        target.y = miner.y + Math.sin(hookAngle) * hookLen;
      }
      if(hookLen <= 0){
        hookLen = 0;
        if(target){
          score += target.val;
          for(var j=items.length-1;j>=0;j--){
            if(items[j] === target){ items.splice(j,1); break; }
          }
          target = null;
        }
        hookAngle = Math.PI/2;
        state = IDLE;
      }
    }
    updateHud();
  }

  function getTip(){
    return {
      x: miner.x + Math.cos(hookAngle) * hookLen,
      y: miner.y + Math.sin(hookAngle) * hookLen
    };
  }

  function updateHud(){
    document.getElementById('score').textContent = '分数 ' + score;
    document.getElementById('time').textContent  = '时间 ' + Math.ceil(timeLeft);
    var msg = document.getElementById('msg');
    if(timeLeft <= 0){
      msg.style.display = '-webkit-box';
      msg.style.display = 'flex';
      document.getElementById('msgScore').textContent = '得分 ' + score;
    } else {
      msg.style.display = 'none';
    }
  }

  // ===== 绘制 =====
  function draw(){
    // 天空
    ctx.fillStyle = '#6BB6FF';
    ctx.fillRect(0, 0, W, groundY);

    // 太阳
    ctx.fillStyle = '#FFEB3B';
    var sr = Math.max(22, 22*scale);
    ctx.beginPath();
    ctx.arc(Math.floor(W*0.85), Math.floor(H*0.08), sr, 0, Math.PI*2);
    ctx.fill();

    // 云
    ctx.fillStyle = '#FFFFFF';
    drawCloud(W*0.20, H*0.10, 1.0);
    drawCloud(W*0.65, H*0.05, 0.8);

    // 土地
    ctx.fillStyle = '#8B5A2B';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#4CAF50';
    var gh = Math.max(8, 8*scale);
    ctx.fillRect(0, groundY - gh, W, gh);

    // 矿工
    var bw = Math.max(44, 38*scale), bh = Math.max(36, 30*scale);
    ctx.fillStyle = '#E53935';
    ctx.fillRect(miner.x - bw/2, miner.y - bh, bw, bh);
    var hr = Math.max(16, 14*scale);
    ctx.fillStyle = '#FFCC80';
    ctx.beginPath();
    ctx.arc(miner.x, miner.y - bh - hr, hr, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(miner.x - 18*scale, miner.y - bh - hr*2 - 4*scale, 36*scale, 5*scale);
    ctx.fillRect(miner.x - 13*scale, miner.y - bh - hr*2 - 14*scale, 26*scale, 10*scale);

    // 摆动预瞄虚影 (IDLE 时)
    if(state === IDLE){
      var previewLen = hookLen + 30 * scale;
      var px = miner.x + Math.cos(hookAngle) * previewLen;
      var py = miner.y + Math.sin(hookAngle) * previewLen;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.arc(px, py, 10*scale, 0, Math.PI*2);
      ctx.fill();
    }

    // 绳
    var tip = getTip();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = Math.max(4, 4*scale);
    ctx.beginPath();
    ctx.moveTo(miner.x, miner.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    // 钩头或抓到的物品
    if(state === BACK && target){
      drawItem(target, target.x, target.y);
    } else {
      drawHookHead(tip.x, tip.y);
    }

    // 物品
    for(var i=0;i<items.length;i++){
      var it = items[i];
      if(it === target && state === BACK) continue;
      drawItem(it, it.x, it.y);
    }
  }

  function drawCloud(x, y, s){
    var r = Math.max(14, 16*scale*s);
    ctx.beginPath();
    ctx.arc(x,         y, r,        0, Math.PI*2);
    ctx.arc(x + r,     y, r*0.85,   0, Math.PI*2);
    ctx.arc(x - r,     y, r*0.75,   0, Math.PI*2);
    ctx.arc(x + r*0.5, y - r*0.5, r*0.7, 0, Math.PI*2);
    ctx.fill();
  }

  function drawHookHead(x, y){
    var sz = Math.max(14, 12*scale);
    ctx.fillStyle = '#212121';
    ctx.beginPath();
    ctx.moveTo(x - sz, y);
    ctx.lineTo(x + sz, y);
    ctx.lineTo(x, y + sz*1.4);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(x - sz - 6*scale, y - 3*scale, 6*scale, 6*scale);
    ctx.fillRect(x + sz,          y - 3*scale, 6*scale, 6*scale);
    // 钩头顶端闪烁 (摆动时提示方向)
    if(state === IDLE){
      var blink = Math.floor(Date.now() / 200) % 2;
      ctx.fillStyle = blink ? '#FFFFFF' : '#FFEB3B';
    } else {
      ctx.fillStyle = '#FFFFFF';
    }
    ctx.fillRect(x - 3, y - 10, 6, 5);
  }

  // 椭圆兼容 (Kindle 老 WebKit 不支持 ctx.ellipse)
  function drawEllipse(cx, cy, rx, ry){
    ctx.beginPath();
    for(var i=0;i<=36;i++){
      var a = i * Math.PI * 2 / 36;
      var px = cx + rx * Math.cos(a);
      var py = cy + ry * Math.sin(a);
      if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawItem(it, x, y){
    var r = it.r;
    var t = it.type;

    // 金块 (卡通金黄带描边高光)
    if(t === 'goldBig' || t === 'goldMid' || t === 'goldSmall'){
      // 描边
      ctx.fillStyle = it.dark;
      ctx.beginPath(); ctx.arc(x, y, r+3, 0, Math.PI*2); ctx.fill();
      // 主体
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      // 高光
      ctx.fillStyle = '#FFF59D';
      ctx.beginPath(); ctx.arc(x - r*0.35, y - r*0.35, r*0.35, 0, Math.PI*2); ctx.fill();
      // 闪光小星
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x + r*0.2, y - r*0.5, r*0.15, r*0.4);
      ctx.fillRect(x + r*0.05, y - r*0.35, r*0.4, r*0.15);
    }
    else if(t === 'chicken'){
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = it.dark; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
      // 翅膀
      ctx.fillStyle = '#FF8F00';
      ctx.beginPath(); ctx.arc(x - r*0.5, y + r*0.1, r*0.45, 0, Math.PI*2); ctx.fill();
      // 鸡冠
      ctx.fillStyle = '#E53935';
      ctx.beginPath(); ctx.arc(x - r*0.1, y - r*0.85, r*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.2, y - r*0.95, r*0.15, 0, Math.PI*2); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.3, r*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.3, y - r*0.3, r*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.3, r*0.08, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.3, y - r*0.3, r*0.08, 0, Math.PI*2); ctx.fill();
      // 嘴
      ctx.fillStyle = '#FF6F00';
      ctx.beginPath();
      ctx.moveTo(x + r*0.35, y + r*0.0);
      ctx.lineTo(x + r*0.75, y + r*0.15);
      ctx.lineTo(x + r*0.35, y + r*0.25);
      ctx.closePath(); ctx.fill();
    }
    else if(t === 'pig'){
      ctx.fillStyle = it.color;
      drawEllipse(x, y, r*1.0, r*0.85); ctx.fill();
      ctx.strokeStyle = it.dark; ctx.lineWidth = 2;
      drawEllipse(x, y, r*1.0, r*0.85); ctx.stroke();
      // 耳朵
      ctx.fillStyle = '#F48FB1';
      ctx.beginPath();
      ctx.moveTo(x - r*0.7, y - r*0.4); ctx.lineTo(x - r*0.5, y - r*0.9); ctx.lineTo(x - r*0.25, y - r*0.4);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + r*0.25, y - r*0.4); ctx.lineTo(x + r*0.5, y - r*0.9); ctx.lineTo(x + r*0.7, y - r*0.4);
      ctx.closePath(); ctx.fill();
      // 鼻
      ctx.fillStyle = '#F06292';
      drawEllipse(x, y + r*0.1, r*0.35, r*0.25); ctx.fill();
      ctx.fillStyle = '#880E4F';
      ctx.beginPath(); ctx.arc(x - r*0.12, y + r*0.1, r*0.06, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.12, y + r*0.1, r*0.06, 0, Math.PI*2); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x - r*0.35, y - r*0.35, r*0.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.35, y - r*0.35, r*0.1, 0, Math.PI*2); ctx.fill();
      // 笑嘴
      ctx.strokeStyle = '#880E4F'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y + r*0.25, r*0.2, 0.1*Math.PI, 0.9*Math.PI);
      ctx.stroke();
    }
    else if(t === 'rabbit'){
      // 身体
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.arc(x, y + r*0.1, r*0.8, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = it.dark; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y + r*0.1, r*0.8, 0, Math.PI*2); ctx.stroke();
      // 长耳朵
      ctx.fillStyle = '#FFFFFF';
      drawEllipse(x - r*0.35, y - r*0.7, r*0.2, r*0.55); ctx.fill();
      drawEllipse(x + r*0.35, y - r*0.7, r*0.2, r*0.55); ctx.fill();
      ctx.strokeStyle = '#9E9E9E'; ctx.lineWidth = 1.5;
      drawEllipse(x - r*0.35, y - r*0.7, r*0.2, r*0.55); ctx.stroke();
      drawEllipse(x + r*0.35, y - r*0.7, r*0.2, r*0.55); ctx.stroke();
      ctx.fillStyle = '#F8BBD0';
      drawEllipse(x - r*0.35, y - r*0.7, r*0.1, r*0.4); ctx.fill();
      drawEllipse(x + r*0.35, y - r*0.7, r*0.1, r*0.4); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x - r*0.25, y, r*0.08, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.25, y, r*0.08, 0, Math.PI*2); ctx.fill();
      // 鼻子
      ctx.fillStyle = '#F48FB1';
      ctx.beginPath(); ctx.arc(x, y + r*0.18, r*0.08, 0, Math.PI*2); ctx.fill();
      // 嘴
      ctx.strokeStyle = '#9E9E9E'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, y + r*0.18); ctx.lineTo(x, y + r*0.32);
      ctx.moveTo(x, y + r*0.32); ctx.lineTo(x - r*0.1, y + r*0.4);
      ctx.moveTo(x, y + r*0.32); ctx.lineTo(x + r*0.1, y + r*0.4);
      ctx.stroke();
    }
    else if(t === 'cat'){
      // 头
      ctx.fillStyle = it.color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = it.dark; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
      // 耳朵
      ctx.fillStyle = '#FF8A65';
      ctx.beginPath();
      ctx.moveTo(x - r*0.85, y - r*0.5); ctx.lineTo(x - r*0.4, y - r*0.95); ctx.lineTo(x - r*0.25, y - r*0.5);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + r*0.25, y - r*0.5); ctx.lineTo(x + r*0.4, y - r*0.95); ctx.lineTo(x + r*0.85, y - r*0.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFCCBC';
      ctx.beginPath();
      ctx.moveTo(x - r*0.7, y - r*0.55); ctx.lineTo(x - r*0.5, y - r*0.8); ctx.lineTo(x - r*0.4, y - r*0.55);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + r*0.4, y - r*0.55); ctx.lineTo(x + r*0.5, y - r*0.8); ctx.lineTo(x + r*0.7, y - r*0.55);
      ctx.closePath(); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#4CAF50';
      ctx.beginPath(); ctx.arc(x - r*0.35, y - r*0.15, r*0.18, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.35, y - r*0.15, r*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x - r*0.35, y - r*0.15, r*0.08, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.35, y - r*0.15, r*0.08, 0, Math.PI*2); ctx.fill();
      // 鼻子
      ctx.fillStyle = '#F48FB1';
      ctx.beginPath();
      ctx.moveTo(x, y + r*0.15); ctx.lineTo(x - r*0.12, y + r*0.05); ctx.lineTo(x + r*0.12, y + r*0.05);
      ctx.closePath(); ctx.fill();
      // 嘴
      ctx.strokeStyle = '#5D4037'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y + r*0.15); ctx.lineTo(x, y + r*0.3);
      ctx.moveTo(x, y + r*0.3); ctx.lineTo(x - r*0.15, y + r*0.4);
      ctx.moveTo(x, y + r*0.3); ctx.lineTo(x + r*0.15, y + r*0.4);
      ctx.stroke();
      // 胡须
      ctx.strokeStyle = '#5D4037'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - r*0.5, y + r*0.2); ctx.lineTo(x - r, y + r*0.1);
      ctx.moveTo(x - r*0.5, y + r*0.3); ctx.lineTo(x - r, y + r*0.3);
      ctx.moveTo(x + r*0.5, y + r*0.2); ctx.lineTo(x + r, y + r*0.1);
      ctx.moveTo(x + r*0.5, y + r*0.3); ctx.lineTo(x + r, y + r*0.3);
      ctx.stroke();
    }
    else if(t === 'diamond'){
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = it.dark;
      var sz = r+2;
      ctx.rotate(Math.PI/4);
      ctx.fillRect(-sz, -sz, sz*2, sz*2);
      ctx.fillStyle = it.color;
      ctx.fillRect(-r, -r, r*2, r*2);
      ctx.fillStyle = '#B2EBF2';
      ctx.fillRect(-r, -r, r, r);
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r*0.6, -r*0.6); ctx.lineTo(r*0.6, r*0.6);
      ctx.stroke();
      ctx.restore();
    }
    else if(t === 'turtle'){
      // 腿
      ctx.fillStyle = '#66BB6A';
      ctx.beginPath(); ctx.arc(x - r*0.7, y + r*0.55, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.7, y + r*0.55, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x - r*0.4, y + r*0.85, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.4, y + r*0.85, r*0.22, 0, Math.PI*2); ctx.fill();
      // 头
      ctx.beginPath(); ctx.arc(x, y - r*0.55, r*0.35, 0, Math.PI*2); ctx.fill();
      // 龟壳
      ctx.fillStyle = it.color;
      drawEllipse(x, y + r*0.15, r*0.85, r*0.65); ctx.fill();
      ctx.strokeStyle = it.dark; ctx.lineWidth = 2;
      drawEllipse(x, y + r*0.15, r*0.85, r*0.65); ctx.stroke();
      // 壳纹
      ctx.strokeStyle = it.dark; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - r*0.5, y - r*0.2); ctx.lineTo(x - r*0.5, y + r*0.5);
      ctx.moveTo(x, y - r*0.4); ctx.lineTo(x, y + r*0.6);
      ctx.moveTo(x + r*0.5, y - r*0.2); ctx.lineTo(x + r*0.5, y + r*0.5);
      ctx.stroke();
      // 眼睛
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x - r*0.12, y - r*0.65, r*0.06, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.12, y - r*0.65, r*0.06, 0, Math.PI*2); ctx.fill();
      // 笑嘴
      ctx.strokeStyle = '#1B5E20'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y - r*0.45, r*0.15, 0.1*Math.PI, 0.9*Math.PI);
      ctx.stroke();
    }
  }

  // ===== 主循环 (setInterval,Kindle 老内核最稳) =====
  var last = 0;
  function loop(){
    var now = Date.now();
    var dt = last ? Math.min((now - last)/1000, 0.1) : 0.016;
    last = now;
    update(dt);
    draw();
  }

  // ===== 启动 (Kindle 兼容: 多次延迟 resize) =====
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', resize);
  }
  resize();
  reset();
  // 兜底:Kindle 实验浏览器 viewport 经常延迟到位
  var delays = [100, 300, 600, 1000, 1500, 2500, 4000];
  for(var i=0;i<delays.length;i++){
    (function(d){ setTimeout(resize, d); })(delays[i]);
  }
  setInterval(loop, 1000/40);
})();
</script>
