<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, height=device-height">
<meta name="theme-color" content="#6BB6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>黄金矿工</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="wrap">
  <canvas id="game">您的浏览器不支持 Canvas</canvas>
  <div id="hud">
    <span id="score">分数 0</span>
    <span id="time">时间 60</span>
  </div>
  <div id="hint">点击屏幕:发射 / 取消 / 再发射</div>
  <div id="msg">
    <h1>游戏结束</h1>
    <p id="msgScore">得分 0</p>
    <p>点击屏幕重新开始</p>
  </div>
</div>

<script>// 注册离线 Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}</script>
<script src="./js/config.js"></script>
<script src="./js/state.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/render/draw.js"></script>
<script src="./js/render/items.js"></script>
<script src="./js/update.js"></script>
<script src="./js/input.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
