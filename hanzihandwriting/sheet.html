<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>打印练字纸 · 汉字书写练习｜文心书院</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2b2420">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-icon-180.png">
  <link rel="canonical" href="https://visionchinese.com/learningresources/gamestools/hanzihandwriting/sheet.html">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Hallmark · pre-emit critique: P5 H4 E5 S5 R5 V4 */
    :root {
      --color-canvas: #f2efe7;
      --color-paper: #fffdf7;
      --color-paper-muted: #f7f4ec;
      --color-ink: #252b28;
      --color-muted: #68716c;
      --color-line: #d7d5ca;
      --color-grid: #c9c5b8;
      --color-accent: #245f46;
      --color-accent-strong: #174c36;
      --color-accent-soft: #e3eee7;
      --color-warm: #a4552d;
      --color-warm-soft: #f8e9dc;
      --color-danger: #a3433e;
      --color-focus: #1769aa;
      --color-overlay: rgba(37, 43, 40, .68);
      --color-shadow: rgba(37, 43, 40, .1);
      --font-display: "Songti SC", STSong, "Noto Serif CJK SC", serif;
      --font-body: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      --font-kai: KaiTi, STKaiti, SimKai, "楷体", serif;
      --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
      --radius-sm: .45rem;
      --radius-md: .8rem;
      --radius-lg: 1.15rem;
      --shadow: 0 1rem 3rem var(--color-shadow);
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      margin: 0;
      min-width: 0;
      color: var(--color-ink);
      background: var(--color-canvas);
      font-family: var(--font-body);
      line-height: 1.6;
    }
    button, input, select { font: inherit; }
    button { white-space: nowrap; }
    button:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible {
      outline: .18rem solid var(--color-focus);
      outline-offset: .15rem;
    }
    .shell {
      width: min(76rem, 100%);
      margin-inline: auto;
      padding: clamp(1rem, 4vw, 3rem);
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
    }
    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      padding-block: .5rem 1.2rem;
      border-bottom: 1px solid var(--color-line);
    }
    .masthead h1 {
      min-width: 0;
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 4vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }
    .brand {
      flex: none;
      color: var(--color-accent);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .intro {
      max-width: 46rem;
      margin: 1rem 0 1.5rem;
      color: var(--color-muted);
      font-size: .94rem;
    }
    .panel {
      background: var(--color-paper);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }
    .controls { padding: clamp(1rem, 3vw, 1.6rem); }
    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: .85rem;
    }
    label {
      display: grid;
      gap: .35rem;
      min-width: 0;
      color: var(--color-muted);
      font-size: .82rem;
    }
    input, select {
      width: 100%;
      min-width: 0;
      min-height: 2.85rem;
      padding: .65rem .75rem;
      color: var(--color-ink);
      background: var(--color-paper-muted);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: .55rem;
    }
    .btn {
      min-height: 2.85rem;
      padding: .62rem .9rem;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--color-paper);
      background: var(--color-accent);
      cursor: pointer;
      font-weight: 700;
      transition: background-color .15s ease, transform .15s ease;
    }
    .btn:hover { background: var(--color-accent-strong); }
    .btn:active { transform: translateY(1px); }
    .btn.secondary {
      color: var(--color-ink);
      background: transparent;
      border-color: var(--color-line);
    }
    .btn.secondary:hover { background: var(--color-paper-muted); }
    .btn.danger { color: var(--color-danger); }
    .btn:disabled { cursor: not-allowed; opacity: .55; transform: none; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: .5rem 1rem;
      margin-top: .8rem;
      color: var(--color-muted);
      font-size: .8rem;
    }
    .meta strong { color: var(--color-ink); }
    .status { min-height: 1.35rem; }
    .status[data-tone="error"] { color: var(--color-danger); }
    .practice {
      margin-top: 1rem;
      padding: clamp(1rem, 3vw, 1.6rem);
    }
    .practice[hidden] { display: none; }
    .practice-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .practice-head h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.35rem;
    }
    .counter {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: .78rem;
      font-variant-numeric: tabular-nums;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(9.5rem, 100%), 1fr));
      gap: 1rem;
    }
    .cell {
      position: relative;
      display: grid;
      min-width: 0;
      place-items: center;
      padding: .65rem;
      background: var(--color-paper-muted);
      border: 1px solid var(--color-line);
      border-radius: var(--radius-md);
    }
    .cell canvas {
      display: block;
      width: min(100%, 11rem);
      height: auto;
      aspect-ratio: 1;
      border-radius: .25rem;
      background: var(--color-paper);
      cursor: crosshair;
      touch-action: none;
    }
    .cell-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 11rem);
      min-height: 2rem;
      margin-top: .4rem;
      color: var(--color-muted);
      font-size: .78rem;
    }
    .cell-meta .char {
      color: var(--color-ink);
      font-family: var(--font-kai);
      font-size: 1.1rem;
    }
    .clear-cell {
      min-width: 2rem;
      min-height: 2rem;
      padding: 0 .4rem;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-sm);
      color: var(--color-muted);
      background: var(--color-paper);
      cursor: pointer;
    }
    .clear-cell:hover { color: var(--color-danger); background: var(--color-warm-soft); }
    .empty {
      display: grid;
      min-height: 13rem;
      place-items: center;
      padding: 2rem;
      color: var(--color-muted);
      text-align: center;
      border: 1px dashed var(--color-line);
      border-radius: var(--radius-md);
    }
    details {
      margin-top: 1rem;
      padding: .8rem 1rem;
      border-top: 1px solid var(--color-line);
      color: var(--color-muted);
      font-size: .86rem;
    }
    summary { color: var(--color-ink); cursor: pointer; font-weight: 700; }
    details ol { margin: .7rem 0 0; padding-inline-start: 1.3rem; }
    details li + li { margin-top: .4rem; }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: .8rem;
      border-top: 1px solid var(--color-line);
      color: var(--color-muted);
      font-size: .78rem;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: var(--color-paper);
      background: var(--color-overlay);
    }
    .overlay[hidden] { display: none; }
    .loading-box {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .9rem 1.1rem;
      border-radius: var(--radius-md);
      background: var(--color-ink);
    }
    .spinner {
      width: 1.25rem;
      height: 1.25rem;
      border: .18rem solid var(--color-muted);
      border-top-color: var(--color-paper);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(1turn); } }

    @media (min-width: 42rem) {
      .form-grid { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(9rem, .75fr); }
      .actions { grid-column: 1 / -1; }
    }
    @media (min-width: 64rem) {
      .form-grid { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(9rem, .75fr) auto; }
      .actions { grid-column: auto; }
    }
    @media (hover: hover) and (pointer: fine) {
      .btn:hover { transform: translateY(-1px); }
      .btn:active { transform: translateY(1px); }
    }
    @media (pointer: coarse) {
      .btn, input, select { min-height: 3rem; }
      .clear-cell { min-width: 2.75rem; min-height: 2.75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1>汉字书写练习</h1>
      <div class="brand">文心书院</div>
    </header>
    <p class="intro">输入汉字，选择每字练习格数，即可在触屏设备上直接书写，并导出排版好的 A4 PDF。</p>

    <section class="panel controls" aria-labelledby="controlTitle">
      <div class="form-grid">
        <label>
          练习汉字（最多 30 字）
          <input id="inputText" type="text" maxlength="90" inputmode="text" autocomplete="off" placeholder="例如：春风花草">
        </label>
        <label>
          学生姓名
          <input id="studentName" type="text" maxlength="30" autocomplete="name" placeholder="选填">
        </label>
        <label>
          每字格数
          <select id="repeatCount">
            <option value="1">1 格</option>
            <option value="2">2 格</option>
            <option value="3" selected>3 格</option>
            <option value="4">4 格</option>
          </select>
        </label>
        <div class="actions">
          <button class="btn" id="generateBtn" type="button">生成练习</button>
          <button class="btn secondary" id="saveBtn" type="button" disabled>保存 PDF</button>
          <button class="btn secondary danger" id="clearAllBtn" type="button" disabled>清除笔迹</button>
        </div>
      </div>
      <div class="meta">
        <span id="inputCount"><strong>0</strong> / 30 个汉字</span>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
      <details>
        <summary>操作说明 / Instructions</summary>
        <ol>
          <li>输入汉字并生成练习；每个字的第一格显示浅色参考字。</li>
          <li>用鼠标、触控笔或手指在格内书写；“清除”只重置当前格。</li>
          <li>填写姓名后保存 PDF。所有内容只在当前浏览器中处理。</li>
        </ol>
      </details>
    </section>

    <section class="panel practice" id="practice" aria-labelledby="practiceTitle">
      <div class="practice-head">
        <h2 id="practiceTitle">练习纸</h2>
        <span class="counter" id="gridCount">0 格</span>
      </div>
      <div class="empty" id="emptyState">输入汉字后，点击“生成练习”。</div>
      <div class="grid" id="grid"></div>
    </section>

    <footer class="footer">
      <span>visionchinese.com · 文心书院</span>
      <span>本地处理，不上传书写内容</span>
    </footer>
  </main>

  <div class="overlay" id="loadingOverlay" role="status" aria-live="assertive" hidden>
    <div class="loading-box"><span class="spinner" aria-hidden="true"></span><span>正在生成 PDF…</span></div>
  </div>

      const rootStyle = getComputedStyle(document.documentElement);
      const color = name => rootStyle.getPropertyValue(name).trim();
      const COLORS = {
        paper: color("--color-paper"),
        ink: color("--color-ink"),
        muted: color("--color-muted"),
        line: color("--color-line"),
        grid: color("--color-grid"),
        accent: color("--color-accent")
      };
      const FONT_KAI = rootStyle.getPropertyValue("--font-kai").trim();
      const FONT_BODY = rootStyle.getPropertyValue("--font-body").trim();
      const FONT_DISPLAY = rootStyle.getPropertyValue("--font-display").trim();
      const state = { cells: [], signature: "" };
      const ids = [
        "inputText", "studentName", "repeatCount", "generateBtn", "saveBtn",
        "clearAllBtn", "inputCount", "status", "gridCount", "emptyState",
        "grid", "loadingOverlay", "practice"
      ];
      const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));

      function setStatus(message, tone = "") {
        el.status.textContent = message;
        el.status.dataset.tone = tone;
      }

      function getHanCharacters(value) {
        return [...value].filter(char => /\p{Script=Han}/u.test(char)).slice(0, MAX_CHARS);
      }

      function currentSignature() {
        return `${getHanCharacters(el.inputText.value).join("")}|${el.repeatCount.value}`;
      }

      function updateInputCount() {
        const count = getHanCharacters(el.inputText.value).length;
        el.inputCount.firstElementChild.textContent = String(count);
        const stale = Boolean(state.cells.length && state.signature !== currentSignature());
        if (stale) setStatus("输入或格数已改变，请重新生成。");
      }

      function makeCanvas() {
        const canvas = document.createElement("canvas");
        canvas.width = LOGICAL_SIZE * PIXEL_RATIO;
        canvas.height = LOGICAL_SIZE * PIXEL_RATIO;
        canvas.setAttribute("aria-label", "可书写的米字格");
        canvas.tabIndex = 0;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.setTransform(PIXEL_RATIO, 0, 0, PIXEL_RATIO, 0, 0);
        return { canvas, ctx };
      }

      function drawGrid(ctx, ghost = "") {
        const size = LOGICAL_SIZE;
        ctx.save();
        ctx.setTransform(PIXEL_RATIO, 0, 0, PIXEL_RATIO, 0, 0);
        ctx.fillStyle = COLORS.paper;
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = COLORS.grid;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([]);
        ctx.strokeRect(.6, .6, size - 1.2, size - 1.2);
        ctx.strokeStyle = COLORS.line;
        ctx.lineWidth = .8;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
        ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
        ctx.moveTo(0, 0); ctx.lineTo(size, size);
        ctx.moveTo(size, 0); ctx.lineTo(0, size);
        ctx.stroke();
        ctx.setLineDash([]);
        if (ghost) {
          ctx.globalAlpha = .16;
          ctx.fillStyle = COLORS.ink;
          ctx.font = `${size * .66}px ${FONT_KAI}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          const metrics = ctx.measureText(ghost);
          const left = metrics.actualBoundingBoxLeft || metrics.width / 2;
          const right = metrics.actualBoundingBoxRight || metrics.width / 2;
          const ascent = metrics.actualBoundingBoxAscent || size * .33;
          const descent = metrics.actualBoundingBoxDescent || size * .08;
          const drawX = size / 2 + (left - right) / 2;
          const drawY = size / 2 + (ascent - descent) / 2;
          ctx.fillText(ghost, drawX, drawY);
        }
        ctx.restore();
      }

      function setupDrawing(cell) {
        const { canvas, ctx } = cell;
        let activePointer = null;
        let previous = null;

        const point = event => {
          const rect = canvas.getBoundingClientRect();
          return {
            x: (event.clientX - rect.left) * LOGICAL_SIZE / rect.width,
            y: (event.clientY - rect.top) * LOGICAL_SIZE / rect.height
          };
        };

        canvas.addEventListener("pointerdown", event => {
          if (activePointer !== null) return;
          activePointer = event.pointerId;
          canvas.setPointerCapture(event.pointerId);
          previous = point(event);
          event.preventDefault();
        });
        canvas.addEventListener("pointermove", event => {
          if (event.pointerId !== activePointer || !previous) return;
          const next = point(event);
          ctx.save();
          ctx.strokeStyle = COLORS.ink;
          ctx.lineWidth = 3.4;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(previous.x, previous.y);
          ctx.lineTo(next.x, next.y);
          ctx.stroke();
          ctx.restore();
          previous = next;
          cell.hasInk = true;
          event.preventDefault();
        });
        const end = event => {
          if (event.pointerId !== activePointer) return;
          activePointer = null;
          previous = null;
        };
        canvas.addEventListener("pointerup", end);
        canvas.addEventListener("pointercancel", end);
        canvas.addEventListener("lostpointercapture", () => {
          activePointer = null;
          previous = null;
        });
      }

      function resetCell(cell) {
        drawGrid(cell.ctx, cell.ghost);
        cell.hasInk = false;
      }

      function buildCell(char, repeatIndex, charIndex) {
        const ghost = repeatIndex === 0 ? char : "";
        const { canvas, ctx } = makeCanvas();
        const cell = { canvas, ctx, char, ghost, hasInk: false };
        drawGrid(ctx, ghost);
        setupDrawing(cell);

        const wrapper = document.createElement("article");
        wrapper.className = "cell";
        const meta = document.createElement("div");
        meta.className = "cell-meta";
        const label = document.createElement("span");
        label.className = "char";
        label.textContent = `${char} · ${repeatIndex + 1}`;
        const clear = document.createElement("button");
        clear.className = "clear-cell";
        clear.type = "button";
        clear.textContent = "清除";
        clear.setAttribute("aria-label", `清除“${char}”第 ${repeatIndex + 1} 格`);
        clear.addEventListener("click", () => resetCell(cell));
        meta.append(label, clear);
        wrapper.append(canvas, meta);
        canvas.setAttribute("aria-label", `“${char}”第 ${repeatIndex + 1} 个练习格`);
        cell.wrapper = wrapper;
        cell.order = charIndex;
        return cell;
      }

      function generate() {
        const chars = getHanCharacters(el.inputText.value);
        if (!chars.length) {
          setStatus("请输入至少一个汉字。", "error");
          el.inputText.focus();
          return;
        }
        const sourceCount = [...el.inputText.value].filter(char => /\p{Script=Han}/u.test(char)).length;
        if (sourceCount > MAX_CHARS) setStatus(`只生成前 ${MAX_CHARS} 个汉字。`);
        else setStatus("练习格已生成，可以开始书写。");

        const repeats = Number(el.repeatCount.value);
        state.cells = [];
        const fragment = document.createDocumentFragment();
        chars.forEach((char, charIndex) => {
          for (let index = 0; index < repeats; index++) {
            const cell = buildCell(char, index, charIndex);
            state.cells.push(cell);
            fragment.append(cell.wrapper);
          }
        });
        el.grid.replaceChildren(fragment);
        state.signature = currentSignature();
        el.emptyState.hidden = true;
        el.gridCount.textContent = `${state.cells.length} 格`;
        el.saveBtn.disabled = false;
        el.clearAllBtn.disabled = false;
        el.practice.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function clearAllInk() {
        state.cells.forEach(resetCell);
        setStatus("所有笔迹已清除。");
      }

      function loadLogo() {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error("Logo image failed to load"));
          image.src = LOGO_URL;
        });
      }

      function createHeaderImage(name, dateText, logo) {
        const canvas = document.createElement("canvas");
        canvas.width = 1190;
        canvas.height = 150;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = COLORS.paper;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const logoHeight = 104;
        const logoWidth = logoHeight * logo.naturalWidth / logo.naturalHeight;
        ctx.drawImage(logo, 32, 11, logoWidth, logoHeight);

        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = COLORS.ink;
        ctx.font = `bold 40px ${FONT_DISPLAY}`;
        ctx.fillText("汉字书写练习", 128, 55);
        ctx.fillStyle = COLORS.muted;
        ctx.font = `24px ${FONT_BODY}`;
        ctx.fillText("文心书院 · visionchinese.com", 128, 92);
        ctx.textAlign = "right";
        ctx.fillStyle = COLORS.ink;
        ctx.font = `26px ${FONT_BODY}`;
        ctx.fillText(`学生：${name}`, 1158, 51);
        ctx.fillStyle = COLORS.muted;
        ctx.font = `23px ${FONT_BODY}`;
        ctx.fillText(`日期：${dateText}`, 1158, 91);
        ctx.strokeStyle = COLORS.accent;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(32, 126);
        ctx.lineTo(1158, 126);
        ctx.stroke();
        return canvas.toDataURL("image/png");
      }

      function createFooterImage(page, total) {
        const canvas = document.createElement("canvas");
        canvas.width = 1190;
        canvas.height = 90;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = COLORS.paper;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = COLORS.line;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(32, 14);
        ctx.lineTo(1158, 14);
        ctx.stroke();
        ctx.fillStyle = COLORS.muted;
        ctx.font = `20px ${FONT_BODY}`;
        ctx.textAlign = "left";
        ctx.fillText("visionchinese.com", 32, 56);
        ctx.textAlign = "center";
        ctx.fillText("© 文心书院版权所有", 595, 56);
        ctx.textAlign = "right";
        ctx.fillText(`第 ${page} / ${total} 页`, 1158, 56);
        return canvas.toDataURL("image/png");
      }

      async function savePDF() {
        if (!state.cells.length) return;
        if (state.signature !== currentSignature()) {
          setStatus("输入或格数已改变，请重新生成后再保存。", "error");
          return;
        }
        if (!window.jspdf?.jsPDF) {
          setStatus("PDF 组件未加载，请检查网络后刷新页面。", "error");
          return;
        }

        el.loadingOverlay.hidden = false;
        el.saveBtn.disabled = true;
        await new Promise(resolve => requestAnimationFrame(resolve));
        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ unit: "mm", format: "a4", compress: true });
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const marginX = 15;
          const cellSize = 40;
          const gap = 5;
          const columns = 4;
          const headerHeight = 26.5;
          const footerHeight = 15.9;
          const startY = headerHeight + 6;
          const rows = Math.floor((pageHeight - startY - footerHeight - 4) / (cellSize + gap));
          const perPage = columns * rows;
          const totalPages = Math.ceil(state.cells.length / perPage);
          const name = el.studentName.value.trim() || "学生";
          const isoDate = new Date().toLocaleDateString("en-CA");
          const displayDate = isoDate.replaceAll("-", "/");
          const logo = await loadLogo();
          const header = createHeaderImage(name, displayDate, logo);

          state.cells.forEach((cell, index) => {
            const pageIndex = Math.floor(index / perPage);
            const localIndex = index % perPage;
            if (localIndex === 0) {
              if (pageIndex > 0) pdf.addPage();
              pdf.addImage(header, "PNG", 0, 0, pageWidth, headerHeight, "header", "FAST");
            }
            const column = localIndex % columns;
            const row = Math.floor(localIndex / columns);
            const x = marginX + column * (cellSize + gap);
            const y = startY + row * (cellSize + gap);
            pdf.addImage(cell.canvas, "PNG", x, y, cellSize, cellSize, undefined, "FAST");
            const isPageEnd = localIndex === perPage - 1 || index === state.cells.length - 1;
            if (isPageEnd) {
              pdf.addImage(
                createFooterImage(pageIndex + 1, totalPages),
                "PNG", 0, pageHeight - footerHeight, pageWidth, footerHeight,
                undefined, "FAST"
              );
            }
          });
          const safeName = name.replace(/[\\/:*?"<>|]/g, "_");
          pdf.save(`${safeName}_${isoDate}_汉字书写练习.pdf`);
          setStatus("PDF 已开始下载。");
        } catch (error) {
          console.error(error);
          const logoFailed = error instanceof Error && error.message.includes("Logo");
          setStatus(
            logoFailed
              ? "内嵌 Logo 无法读取，请重新下载此 HTML 文件。"
              : "PDF 生成失败，请刷新页面后重试。",
            "error"
          );
        } finally {
          el.loadingOverlay.hidden = true;
          el.saveBtn.disabled = false;
        }
      }

      el.inputText.addEventListener("input", updateInputCount);
      el.repeatCount.addEventListener("change", updateInputCount);
      el.inputText.addEventListener("keydown", event => {
        if (event.key === "Enter") generate();
      });
      el.generateBtn.addEventListener("click", generate);
      el.saveBtn.addEventListener("click", savePDF);
      el.clearAllBtn.addEventListener("click", clearAllInk);
      updateInputCount();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  </script>
</body>
</html>
