<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>描红小书法家 Handwriting Practice · 汉字书写练习</title>
<meta name="description" content="描红小书法家：在田字格里一笔一画跟着写汉字，写错当场提示，写完播放笔顺并评星。内置小一到小六常用字，也能输入自己的字；还可以打印练字纸。">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2420; --paper: #fbf6e6; --red: #b83a2b; --jade: #2f7a5a; --gold: #c99a3c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; color: var(--ink); min-height: 100vh;
    background: radial-gradient(ellipse at 15% 0%, rgba(201,154,60,.22), transparent 50%), repeating-linear-gradient(0deg, rgba(120,90,50,.035) 0 2px, transparent 2px 6px), #efe5ca; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 1rem; display: grid; grid-template-columns: 300px 1fr; gap: 1.2rem; }
  .side, .stage { background: #fffaf0; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); padding: 1rem; }
  .side h3 { font-weight: 900; margin: .2rem 0 .5rem; }
  .sets { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .8rem; }
  .sets button { border: 2px solid var(--ink); background: #fff; border-radius: 999px; padding: .25rem .7rem; font-weight: 800; font-size: .85rem; }
  .sets button.on { background: #f2c46b; }
  .custom { display: flex; gap: .4rem; margin-bottom: .8rem; }
  .custom input { flex: 1; min-width: 0; border: 2px solid var(--ink); border-radius: 10px; padding: .4rem .6rem; font: 700 1.1rem 'Noto Sans SC', sans-serif; }
  .custom button { border: 2px solid var(--ink); background: var(--jade); color: #fff; border-radius: 10px; padding: 0 .8rem; font-weight: 900; }
  .chars { display: grid; grid-template-columns: repeat(5, 1fr); gap: .4rem; }
  .chars button { position: relative; aspect-ratio: 1; border: 2px solid #d8c39a; background: #fff; border-radius: 10px; font-family: 'Ma Shan Zheng', 'KaiTi', serif; font-size: 1.6rem; }
  .chars button.on { border-color: var(--ink); background: #fff1c2; box-shadow: 0 3px 0 var(--ink); }
  .chars button i { position: absolute; right: 2px; bottom: 0; font-style: normal; font-size: .55rem; color: var(--gold); letter-spacing: -1px; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: .7rem; }
  .meta { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  .meta .py { font-size: 1.6rem; font-weight: 900; color: #8a5a2e; }
  .meta .info { font-weight: 800; color: #6b5d50; }
  .board { position: relative; width: min(440px, 80vw); aspect-ratio: 1; background: #fffdf6; border: 4px solid var(--red); border-radius: 6px; touch-action: none; }
  .board svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #writer { position: absolute; inset: 0; }
  .seal { position: absolute; right: -18px; top: -18px; width: 86px; height: 86px; border-radius: 10px; background: var(--red); color: #fbe9dd; font-family: 'Ma Shan Zheng', serif;
    font-size: 2rem; line-height: 1; display: grid; place-items: center; transform: rotate(-12deg); box-shadow: inset 0 0 0 4px #fbe9dd, inset 0 0 0 6px var(--red); animation: stamp .45s cubic-bezier(.2,1.6,.5,1) both; z-index: 3; }
  @keyframes stamp { from { transform: rotate(-30deg) scale(2.6); opacity: 0; } }
  .hint { min-height: 1.5em; font-weight: 800; font-size: 1.05rem; }
  .hint.good { color: var(--jade); } .hint.bad { color: var(--red); }
  .strokes { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .strokes span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
  .strokes span.ok { background: var(--jade); } .strokes span.miss { background: #f2c46b; }
  .stars { font-size: 2.4rem; color: var(--gold); letter-spacing: .3rem; min-height: 1.2em; } .stars .off { color: #e3d9c2; }
  .btns { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
  .btn { border: 3px solid var(--ink); border-radius: 12px; padding: .5rem 1rem; font-weight: 900; background: #fff; box-shadow: 0 3px 0 var(--ink); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.red { background: var(--red); color: #fff; } .btn.jade { background: var(--jade); color: #fff; } .btn.gold { background: #f2c46b; }
  .seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: .25rem .8rem; font-weight: 800; font-size: .85rem; }
  .seg button + button { border-left: 2px solid var(--ink); }
  .seg button.on { background: #f2c46b; }
  .total { margin-top: .8rem; padding: .6rem; border-radius: 12px; background: #f6efdc; font-weight: 800; text-align: center; }
  .petal { position: fixed; z-index: 30; width: 12px; height: 9px; border-radius: 60% 0 60% 0; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(720deg); } }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } .chars { grid-template-columns: repeat(8, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h3>① 选字表</h3>
    <div class="sets" id="sets"></div>
    <div class="custom"><input id="customIn" maxlength="30" placeholder="输入要练的字，如：春夏秋冬"><button id="customBtn">练这些</button></div>
    <h3>② 选一个字</h3>
    <div class="chars" id="chars"></div>
    <div class="total" id="total"></div>
  </aside>
  <main class="stage">
    <div class="meta"><span class="py" id="py"></span><span class="info" id="info"></span>
      <div class="seg" id="mode"><button data-m="trace" class="on">描红</button><button data-m="blind">默写</button></div></div>
    <div class="board" id="board">
      <svg class="grid" viewBox="0 0 100 100"><line x1="50" y1="0" x2="50" y2="100" stroke="#e7b9b0" stroke-width=".6" stroke-dasharray="2 2"/><line x1="0" y1="50" x2="100" y2="50" stroke="#e7b9b0" stroke-width=".6" stroke-dasharray="2 2"/><line x1="0" y1="0" x2="100" y2="100" stroke="#f1d6cf" stroke-width=".4" stroke-dasharray="2 2"/><line x1="100" y1="0" x2="0" y2="100" stroke="#f1d6cf" stroke-width=".4" stroke-dasharray="2 2"/></svg>
      <div id="writer"></div>
    </div>
    <div class="strokes" id="strokes"></div>
    <div class="hint" id="hint">按笔顺，一笔一笔写在田字格里</div>
    <div class="stars" id="stars"></div>
    <div class="btns">
      <button class="btn" id="demoBtn">▶ 看笔顺</button>
      <button class="btn gold" id="againBtn">↺ 再写一次</button>
      <button class="btn red" id="nextBtn">下一个字 →</button>
      <button class="btn" id="soundBtn">🔊 读音</button>
      <button class="btn" onclick="location.href='sheet.html'">🖨 打印练字纸</button>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SETS = {
    '小一': '人口大小上下山水日月火木土手目耳天中左右',
    '小二': '春夏秋冬花草雨雪风云鸟鱼虫林森明星朋友家',
    '小三': '学校老师同学读书写字画画唱歌跳舞早晚冷热',
    '小四': '美丽勇敢认真快乐聪明努力帮助感谢自然世界',
    '小五': '温暖坚持鼓励尊重珍惜责任合作希望梦想成功',
    '小六': '憧憬陶醉毅然忐忑奉献欣慰惭愧体谅坦诚团结',
  };
  const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const best = store.get('vca_hw_best', {});
  let list = [], idx = 0, writer = null, mistakes = 0, setName = '小一', mode = 'trace', strokeCount = 0;

  let actx = null;
  function tone(f, d = .14, type = 'triangle', v = .18, w = 0) {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + w;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .02); } catch (e) {}
  }
  const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319];
  function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; u.rate = .8; speechSynthesis.speak(u); } catch (e) {} }
  const pyOf = (c) => window.pinyinPro ? window.pinyinPro.pinyin(c) : '';

  function renderSets() {
    $('sets').innerHTML = Object.keys(SETS).map(k => `<button class="${k === setName ? 'on' : ''}" data-k="${k}">${k}</button>`).join('');
    $('sets').querySelectorAll('button').forEach(b => b.onclick = () => { setName = b.dataset.k; loadList([...SETS[setName]]); renderSets(); });
  }
  function loadList(chars) { list = [...new Set(chars.filter(c => /[一-鿿]/.test(c)))]; idx = 0; renderChars(); open(0); }
  function renderChars() {
    $('chars').innerHTML = list.map((c, i) => `<button class="${i === idx ? 'on' : ''}" data-i="${i}">${c}${best[c] ? `<i>${'★'.repeat(best[c])}</i>` : ''}</button>`).join('');
    $('chars').querySelectorAll('button').forEach(b => b.onclick = () => open(+b.dataset.i));
    const done = list.filter(c => best[c]).length, stars = list.reduce((n, c) => n + (best[c] || 0), 0);
    $('total').textContent = `本组已写 ${done} / ${list.length} 字 · 共 ${stars} ★`;
  }
  function open(i) {
    idx = i; mistakes = 0; renderChars();
    const c = list[idx]; if (!c) return;
    $('py').textContent = `${c}  ${pyOf(c)}`; $('stars').innerHTML = ''; $('board').querySelector('.seal')?.remove();
    $('hint').className = 'hint'; $('hint').textContent = mode === 'trace' ? '跟着淡色笔画，一笔一笔写' : '默写模式：凭记忆写，写错会提示';
    $('writer').innerHTML = '';
    const size = $('board').clientWidth - 8;
    writer = HanziWriter.create('writer', c, { width: size, height: size, padding: size * .06, showOutline: mode === 'trace', showCharacter: false,
      strokeColor: '#2b2420', outlineColor: '#e8d9c0', highlightColor: '#c99a3c', drawingColor: '#b83a2b', drawingWidth: 26, radicalColor: '#2f7a5a',
      strokeAnimationSpeed: 1.4, delayBetweenStrokes: 180,
      onLoadCharDataSuccess: (d) => { strokeCount = d.strokes.length; $('info').textContent = `${strokeCount} 画`; drawDots(0, []); startQuiz(); },
      onLoadCharDataError: () => { $('hint').className = 'hint bad'; $('hint').textContent = `暂时没有「${c}」的笔画数据，换一个字吧`; } });
  }
  let marks = [];
  function drawDots(n, m) { $('strokes').innerHTML = Array.from({ length: strokeCount }, (_, i) => `<span class="${i < n ? (m[i] ? 'miss' : 'ok') : ''}"></span>`).join(''); }
  function startQuiz() {
    marks = []; mistakes = 0;
    writer.quiz({
      leniency: mode === 'trace' ? 1.3 : 1.1, showHintAfterMisses: mode === 'trace' ? 2 : 3,
      onMistake: (d) => { mistakes++; tone(200, .2, 'sawtooth', .12); $('hint').className = 'hint bad'; $('hint').textContent = `第 ${d.strokeNum + 1} 笔再试试${d.mistakesOnStroke >= 2 ? '，看金色提示' : ''}`; },
      onCorrectStroke: (d) => { marks[d.strokeNum] = d.mistakesOnStroke > 0; tone(PENTA[d.strokeNum % 8]); drawDots(d.strokeNum + 1, marks);
        $('hint').className = 'hint good'; $('hint').textContent = d.strokesRemaining ? `第 ${d.strokeNum + 1} 笔 ✓ 还有 ${d.strokesRemaining} 笔` : '写完啦！'; },
      onComplete: () => finish(),
    });
  }
  function finish() {
    const c = list[idx];
    const stars = mistakes === 0 ? 3 : mistakes <= Math.max(2, Math.ceil(strokeCount / 4)) ? 2 : 1;
    $('stars').innerHTML = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('');
    const seal = document.createElement('div'); seal.className = 'seal'; seal.innerHTML = stars === 3 ? '好<br>字' : '写<br>完'; $('board').appendChild(seal);
    [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .18, i * .1));
    if (stars === 3) petals();
    if (stars > (best[c] || 0)) { best[c] = stars; store.set('vca_hw_best', best); }
    renderChars(); speak(c);
  }
  function petals() { for (let i = 0; i < 30; i++) { const p = document.createElement('div'); p.className = 'petal';
    p.style.cssText = `left:${Math.random() * 100}vw;top:-20px;background:${['#e98fa2', '#f3b8c4', '#c8553d', '#f6d6a8'][i % 4]};--dx:${(Math.random() - .5) * 200}px;animation-duration:${2.5 + Math.random() * 2}s;animation-delay:${Math.random() * .5}s`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 5000); } }

  $('demoBtn').onclick = () => { if (!writer) return; writer.cancelQuiz(); writer.showCharacter(); writer.animateCharacter({ onComplete: () => { writer.hideCharacter(); startQuiz(); } }); speak(list[idx]); };
  $('againBtn').onclick = () => open(idx);
  $('nextBtn').onclick = () => open((idx + 1) % list.length);
  $('soundBtn').onclick = () => speak(list[idx]);
  $('customBtn').onclick = () => { const v = $('customIn').value.trim(); if (v) { setName = ''; renderSets(); loadList([...v]); } };
  $('customIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) $('customBtn').click(); });
  $('mode').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m; $('mode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); open(idx); });
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => open(idx), 300); });

  renderSets(); loadList([...SETS[setName]]);
})();
</script>
</body>
</html>
