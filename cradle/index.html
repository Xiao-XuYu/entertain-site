<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>翻绳接龙 · 两个人一根绳</title>
  <meta name="description" content="两个小朋友轮流接绳的翻绳接龙，六个花样循环，可以一直翻下去。3D 演示每一步怎么接。" />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">翻绳接龙</a>
    <span class="topbar-note">两个人 · 一根绳 · 一直翻下去</span>
  </header>

  <main class="wrap">
    <!-- 列表页 -->
    <section id="listView" class="view">
      <div class="list-intro">
        <h1>两个小朋友，一根绳，六个花样</h1>
        <p>轮流从对方手上把绳子接过来，翻完六步又回到开头，翻到不想停为止。</p>
        <button class="btn primary" id="startBtn">从第一步开始</button>
      </div>
      <ol class="figure-list" id="figureList"></ol>
      <p class="list-note">每一步都有 3D 演示：可以拖动旋转，看清楚是谁、用哪只手、从哪里勾住绳子。</p>
    </section>

    <!-- 详情页 -->
    <section id="detailView" class="view" hidden>
      <div class="detail-head">
        <a class="btn ghost back" href="#/">← 返回列表</a>
        <div class="detail-title">
          <h1 id="figName"></h1>
          <span id="figEn" class="en"></span>
        </div>
        <span class="counter" id="figCounter"></span>
      </div>

      <div class="detail-grid">
        <div class="stage-col">
          <div class="stage-wrap">
            <canvas id="stage3d"></canvas>
            <div class="stage-hint">拖动旋转 · 滚轮缩放</div>
            <div class="holder-chip" id="holderChip"><i></i><span></span></div>
          </div>

          <div class="controls">
            <button class="btn" id="prevBtn">上一步</button>
            <button class="btn primary" id="playBtn">连续演示</button>
            <button class="btn" id="nextBtn">下一步</button>
            <label class="speed"><input type="checkbox" id="speedToggle" /> 慢速</label>
            <button class="btn ghost small" id="camBtn">复位视角</button>
          </div>

          <div class="progress" id="progress"></div>
        </div>

        <aside class="side-col">
          <div class="action-card">
            <div class="action-head">
              <span id="actionWho"></span>
              <span class="action-arrow">接手 →</span>
              <span id="actionNextName"></span>
            </div>
            <p id="actionText"></p>
          </div>

          <p class="fig-desc" id="figDesc"></p>

          <ol class="step-list" id="stepList"></ol>
        </aside>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span>绳子始终是同一根。六步一个循环，接回第一步就能一直翻。</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
